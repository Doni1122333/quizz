<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#dcdcd6;--ac:#2f5fd0;--ok:#1f8a4c;--okb:#e3f4ea;--no:#c23b3b;--nob:#fbe6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--card:#232322;--tx:#ececea;--mut:#9a9a94;--bd:#3a3a37;--ac:#7ea2f5;--ok:#58c985;--okb:#1d3a2a;--no:#ef7b7b;--nob:#3f2222}}
:root[data-theme="dark"]{--bg:#171717;--card:#232322;--tx:#ececea;--mut:#9a9a94;--bd:#3a3a37;--ac:#7ea2f5;--ok:#58c985;--okb:#1d3a2a;--no:#ef7b7b;--nob:#3f2222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 16px}

<script>
const Q=[{"q": "Какая функция финансовой системы связана с аккумуляцией сбережений и их направлением на инвестиционные проекты?", "o": ["Инвестиционная функция (или функция трансформации / мобилизации сбережений).", "Функция управления рисками (защитная / риск-менеджмент / хеджирование).", "Функция международной аллокации (перераспределения) капитала.", "Функция трансформации сбережений в инвестиции (инвестиционная или мобилизационная функция)."], "a": 3}, {"q": "Что представляет собой финансовая система?", "o": ["Совокупность глобальных финансовых рынков, валютных соглашений, транснациональных банков и международных институтов, регулирующих движение капитала между странами.", "Организованная площадка, на которой участники покупают и продают финансовые активы, валюту и ценные бумаги на основе спроса и предложения.", "Совокупность финансовых институтов, рынков, инструментов и органов регулирования, обеспечивающих кругооборот и перераспределение денег в экономике.", "Система платежных и расчетных механизмов, бирж, клиринговых палат, депозитариев и кредитных бюро, обеспечивающих проведение финансовых операций."], "a": 2}, {"q": "Какой элемент финансовой системы обеспечивает обмен и перераспределение финансовых ресурсов посредством покупки и продажи?", "o": ["Функция управления рисками (защитная / риск-менеджмент / хеджирование).", "Инвестиционная функция (или функция трансформации / мобилизации сбережений).", "Финансовый рынок (рынок ценных бумаг, валютный и денежный рынки).", "Функция международной аллокации (перераспределения) капитала."], "a": 2}, {"q": "Что относится к государственным финансам?", "o": ["Государственный бюджет, внебюджетные фонды (пенсионный, соцстрах), государственные доходы (налоги) и государственный долг.", "Для предотвращения глобальных кризисов, гармонизации регуляторных стандартов и поддержания устойчивости мировой экономики.", "Финансовые институты (банки, фонды), финансовые рынки, финансовые инструменты и финансовые регуляторы.", "Стандартный биржевой контракт, обязывающий стороны купить или продать базовый актив в будущем по заранее оговоренной цене."], "a": 0}, {"q": "Какова основная роль корпоративных финансов?", "o": ["Формирование страхового фонда, оценка страховых рисков и возмещение ущерба клиентам при наступлении предусмотренных договором событий.", "Финансирование операционной и инвестиционной деятельности компании, управление денежными потоками и максимизация рыночной стоимости бизнеса.", "Привлечение депозитов населения и бизнеса, размещение привлеченных средств в виде кредитов и проведение расчетно-кассовых операций.", "Объединение средств инвесторов, формирование диверсифицированного портфеля и профессиональное управление вложениями для получения дохода."], "a": 1}, {"q": "Что характеризует международные финансы?", "o": ["Золотодевизный стандарт: доллар США разменивался на золото по фиксированной цене ($35 за унцию), а валюты остальных стран были жестко привязаны к доллару.", "Трансграничное движение денежных потоков и капитала, валютно-расчетные операции между резидентами разных стран и деятельность глобальных фининститутов.", "Обеспечивают ценообразование, ликвидность и прямое перераспределение капитала между кредиторами/инвесторами и заемщиками.", "Мировые финансовые рынки, международные финансовые институты (МВФ, Всемирный банк), транснациональные банки, международные расчетные системы и свод валютных соглашений."], "a": 1}, {"q": "Какая функция финансов способствует снижению возможных финансовых потерь?", "o": ["Инвестиционная функция (или функция трансформации / мобилизации сбережений).", "Функция международной аллокации (перераспределения) капитала.", "Функция управления рисками (защитная / риск-менеджмент / хеджирование).", "Функция трансформации сбережений в инвестиции (инвестиционная или мобилизационная функция)."], "a": 2}, {"q": "Что характерно для банковского кризиса?", "o": ["Увеличение депозитной базы, расширение кредитования и укрепление капитала банков на фоне роста доверия вкладчиков.", "Массовый набег вкладчиков (bank runs), утрата платежеспособности банками, резкий рост невозвратных кредитов и волна банкротств кредитных организаций.", "Резкое обесценение национальной валюты, истощение золотовалютных резервов и потеря доверия к денежной единице страны.", "Массовый отток вкладов и временный дефицит ликвидности при сохранении платежеспособности банков и отсутствии значительного роста просроченных кредитов."], "a": 1}, {"q": "Что означает кризис ликвидности?", "o": ["Мировые финансовые рынки, международные финансовые институты (МВФ, Всемирный банк), транснациональные банки, международные расчетные системы и свод валютных соглашений.", "Совокупность финансовых институтов, рынков, инструментов и органов регулирования, обеспечивающих кругооборот и перераспределение денег в экономике.", "Золотодевизный стандарт: доллар США разменивался на золото по фиксированной цене ($35 за унцию), а валюты остальных стран были жестко привязаны к доллару.", "Острый дефицит «живых» денег и высоколиквидных активов, приводящий к неспособности банков и компаний вовремя платить по текущим обязательствам без катастрофических убытков."], "a": 3}, {"q": "Когда финансовый кризис становится системным?", "o": ["Система экономических отношений, основанная на использовании цифровых технологий, данных и интернета для производства, распределения и обмена благ.", "Когда возникает «эффект домино», парализующий работу большинства ключевых институтов и рынков, и шок напрямую перекидывается на реальный сектор экономики.", "Золотодевизный стандарт: доллар США разменивался на золото по фиксированной цене ($35 за унцию), а валюты остальных стран были жестко привязаны к доллару.", "Совокупность финансовых институтов, рынков, инструментов и органов регулирования, обеспечивающих кругооборот и перераспределение денег в экономике."], "a": 1}, {"q": "Что включает международная финансовая система?", "o": ["Мировые финансовые рынки, международные финансовые институты (МВФ, Всемирный банк), транснациональные банки, международные расчетные системы и свод валютных соглашений.", "Обеспечивает взаимную конвертируемость валют, определяет правила установления валютных курсов и организует механизм трансграничных клиринговых расчетов.", "Финансовые институты (банки, фонды), финансовые рынки, финансовые инструменты и финансовые регуляторы.", "Трансграничное движение денежных потоков и капитала, валютно-расчетные операции между резидентами разных стран и деятельность глобальных фининститутов."], "a": 0}, {"q": "Какая функция международной финансовой системы способствует движению инвестиций между странами?", "o": ["Функция управления рисками (защитная / риск-менеджмент / хеджирование).", "Функция трансформации сбережений в инвестиции (инвестиционная или мобилизационная функция).", "Инвестиционная функция (или функция трансформации / мобилизации сбережений).", "Функция международной аллокации (перераспределения) капитала."], "a": 3}, {"q": "Какую задачу международная финансовая система выполняет в отношении валют?", "o": ["Система экономических отношений, основанная на использовании цифровых технологий, данных и интернета для производства, распределения и обмена благ.", "Обеспечивает взаимную конвертируемость валют, определяет правила установления валютных курсов и организует механизм трансграничных клиринговых расчетов.", "Высокая степень глобализации, цифровизация (развитие финтеха, цифровых валют) и мгновенная трансграничная передача финансовых шоков.", "Внедрение цифровых валют центральных банков (CBDC), децентрализованных финансов (DeFi) и устойчивого («зеленого» / ESG) финансирования."], "a": 1}, {"q": "В каком году была создана Бреттон-Вудская система?", "o": ["В 1945 году.", "В 1947 году.", "В 1944 году.", "В 1950 году."], "a": 2}, {"q": "Что было характерно для Бреттон-Вудской системы?", "o": ["Система экономических отношений, основанная на использовании цифровых технологий, данных и интернета для производства, распределения и обмена благ.", "Когда  <option value="all">Все вопросы по порядку</option>
 <option value="shuf">Все вопросы вперемешку</option>
 <option value="new">Только ещё не пройденные</option>
 <option value="wrong">Работа над ошибками (${S.wrong.length})</option>
 <option value="range">Диапазон номеров</option></select>
 <div id="rg" style="display:none"><div class="row"><div><label>С</label><input type="number" id="a" value="1" min="1" max="${Q.length}"></div><div><label>По</label><input type="number" id="b" value="30" min="1" max="${Q.length}"></div></div></div>
 <label>Сколько вопросов (пусто — все)</label><input type="number" id="n" min="1" placeholder="все">
 <button class="btn" id="go">Начать</button></div>
 <button class="btn g" id="rs">Сбросить прогресс</button>`;
 const m=document.getElementById("m");
 m.onchange=()=>document.getElementById("rg").style.display=m.value=="range"?"block":"none";
 document.getElementById("go").onclick=start;
 document.getElementById("rs").onclick=()=>{if(confirm("Сбросить весь прогресс?")){S={wrong:[],done:{}};save();home()}};
}
function start(){
 const m=document.getElementById("m").value;let ids=Q.map((_,i)=>i);
 if(m=="shuf")ids=shuffle(ids);
 if(m=="new")ids=ids.filter(i=>!(i in S.done));
 if(m=="wrong")ids=shuffle(S.wrong);
 if(m=="range"){const a=+document.getElementById("a").value||1,b=+document.getElementById("b").value||Q.length;ids=ids.slice(Math.max(0,a-1),b)}
 const n=+document.getElementById("n").value;if(n>0)ids=ids.slice(0,n);
 if(!ids.length){alert("В этом режиме нет вопросов");return}
 run={ids,i:0,ok:0,bad:[]};show();
}
function show(){
 const id=run.ids[run.i],q=Q[id];
 $.innerHTML=`<div class="top"><span>Вопрос ${id+1} · ${run.i+1} из ${run.ids.length}</span><span>✓ ${run.ok} · ✗ ${run.bad.length}</span></div>
 <div class="bar"><i style="width:${run.i/run.ids.length*100}%"></i></div>
 <div class="card"><p class="q">${esc(q.q)}</p><div id="os">${q.o.map((t,k)=>`<button class="o" data-k="${k}"><b>${L[k]}</b><span>${esc(t)}</span></button>`).join("")}</div></div>
 <div id="nx"></div><button class="btn g" id="ex">Завершить</button>`;
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 document.getElementById("ex").onclick=end;
}
function pick(k){
 const id=run.ids[run.i],q=Q[id],r=k==q.a;
 document.querySelectorAll(".o").forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add("ok");else if(j==k)b.classList.add("no")});
 S.done[id]=1;
 if(r){run.ok++;S.wrong=S.wrong.filter(x=>x!=id)}else{run.bad.push(id);if(!S.wrong.includes(id))S.wrong.push(id)}
 save();
 const last=run.i==run.ids.length-1;
 document.getElementById("nx").innerHTML=`<button class="btn" id="nb">${last?"Результаты":"Дальше"}</button>`;
 const nb=document.getElementById("nb");nb.onclick=()=>{if(last)end();else{run.i++;show();scrollTo(0,0)}};nb.focus();
}
function end(){
 const t=run.ok+run.bad.length,p=t?Math.round(run.ok/t*100):0;
 $.innerHTML=`<h1>Результат</h1><div class="card"><div class="big">${p}%</div><p class="s">Верно ${run.ok} из ${t}</p></div>
 ${run.bad.length?`<div class="card"><b>Ошибки:</b> вопросы № ${run.bad.map(i=>i+1).join(", ")}</div><button class="btn" id="rw">Повторить ошибки</button>`:""}
 <button class="btn g" id="hm">В меню</button>`;
 document.getElementById("hm").onclick=home;
 const rw=document.getElementById("rw");if(rw)rw.onclick=()=>{run={ids:shuffle(run.bad),i:0,ok:0,bad:[]};show()};
}
home();
</script></body></html>
