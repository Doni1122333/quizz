<script>
const Q=[{"q": "В каком из нижеперечисленных определений приведено определение термина «Финансы»?", "o": ["Совокупность денежных отношений по формированию и использованию общегосударственных денежных фондов для выполнения функций и задач государства.", "Финансовая политика государства.", "Система экономических (денежных) отношений по поводу формирования, распределения и использования централизованных и децентрализованных фондов денежных средств.", "Бюджетная политика."], "a": 2}, {"q": "Какая из нижеперечисленных экономических категорий представляет собой совокупность мероприятий государства по разработке общей концепции, основных направлений, целей и главных задач использования финансовых отношений?", "o": ["Финансовая тактика.", "Финансовая политика государства.", "Финансовая система.", "Государственный финансовый контроль."], "a": 1}, {"q": "Какая из составляющих финансовой политики государства является деятельностью государства, направленной на обеспечение стабильного функционирования бюджетной системы?", "o": ["Бюджетная политика.", "Бюджетный процесс.", "Финансовая политика государства.", "Государственный финансовый контроль."], "a": 0}, {"q": "Что из нижеперечисленного представляет собой долговременный курс финансовой политики, рассчитанный на перспективу и предусматривающий решение крупномасштабных задач, финансирование определенных программ социального и экономического развития?", "o": ["Бизнес-план инвестиционного проекта.", "Пенсия по случаю потери кормильца.", "Пенсия по возрасту.", "Финансовая стратегия."], "a": 3}, {"q": "Какая из нижеперечисленных категорий направлена на решение задач конкретного этапа развития общества путем своевременного изменения способов организации финансовых связей, перегруппировки финансовых ресурсов?", "o": ["Государственный финансовый контроль.", "Финансовая система.", "Финансовая политика государства.", "Финансовая тактика."], "a": 3}, {"q": "Какое из нижеперечисленных понятий представляет собой «совокупность сфер, звеньев, подзвеньев финансовых отношений»?", "o": ["Финансовая политика государства.", "Государственные финансы.", "Финансы домашних хозяйств.", "Финансовая система."], "a": 3}, {"q": "К какому звену финансовой системы можно отнести финансы акционерного общества?", "o": ["Система экономических (денежных) отношений по поводу формирования, распределения и использования централизованных и децентрализованных фондов денежных средств.", "Государственные внебюджетные фонды (сфера государственных финансов).", "Финансы предприятий (хозяйствующих субъектов / коммерческих организаций).", "Финансы коммерческих предприятий (корпоративные финансы) или финансы домашних хозяйств."], "a": 2}, {"q": "К какому звену финансовой системы можно отнести Внебюджетный Пенсионный фонд?", "o": ["Финансы предприятий (хозяйствующих субъектов / коммерческих организаций).", "Система экономических (денежных) отношений по поводу формирования, распределения и использования централизованных и децентрализованных фондов денежных средств.", "Финансовая политика государства.", "Государственные внебюджетные фонды (сфера государственных финансов)."], "a": 3}, {"q": "К какому звену/сфере финансовой системы можно отнести финансы общества с ограниченной ответственностью?", "o": ["Финансы коммерческих предприятий (корпоративные финансы) или финансы домашних хозяйств.", "Система экономических (денежных) отношений по поводу формирования, распределения и использования централизованных и децентрализованных фондов денежных средств.", "Финансы предприятий (хозяйствующих субъектов / коммерческих организаций).", "Государственные внебюджетные фонды (сфера государственных финансов)."], "a": 2}, {"q": "Какой орган проводит в жизнь финансовую, ценовую политику Республики Узбекистан и осуществляет общее руководство организацией финансов и ценообразования на всей ее территории?", "o": ["Олий Мажлис Республики Узбекистан, Президент Республики Узбекистан и Кабинет Министров Республики Узбекистан.", "Финансовая политика государства.", "Система экономических (денежных) отношений по поводу формирования, распределения и использования централизованных и децентрализованных фондов денежных средств.", "Министерство экономики и финансов Республики Узбекистан (МЭФ РУз)."], "a": 3}, {"q": "Что из нижеперечисленного представляет собой обобщенный плановый документ, отражающий поступление и расходование денежных средств коммерческого предприятия?", "o": ["Главный финансовый план государства на текущий год, имеющий силу закона, определяющий источники доходов и направления расходов государства.", "Финансовый план (бюджет доходов и расходов / баланс доходов и расходов предприятия).", "Система экономических (денежных) отношений по поводу формирования, распределения и использования централизованных и децентрализованных фондов денежных средств.", "Бизнес-план инвестиционного проекта."], "a": 1}, {"q": "Что из нижеперечисленного представляет собой основной документ, разрабатываемый предприятием и представляемый инвестору (кредитору) по реальному инвестиционному проекту?", "o": ["Программно-целевой метод (программное бюджетирование).", "Пенсия по случаю потери кормильца.", "Пенсия по возрасту.", "Бизнес-план инвестиционного проекта."], "a": 3}, {"q": "Какую экономическую категорию можно рассматривать как систему денежных отношений, регламентированных государством по поводу формирования, распределения и использования различных денежных фондов?", "o": ["Функция финансового планирования.", "Финансы (государственные финансы).", "Финансы домашних хозяйств.", "Финансовые потоки (потоки финансовых ресурсов)."], "a": 1}, {"q": "Что из перечисленного ниже представляет собой совокупность денежных отношений, организуемых государством, в процессе которых осуществляется формирование и использование общегосударственных фондов денежных средств, необходимых для выполнения государством своих функций и задач?", "o": ["Финансы домашних хозяйств.", "Государственные финансы.", "Домашнее хозяйство (домохозяйство).", "Финансовый прогноз (финансовое прогнозирование)."], "a": 1}, {"q": "Какая из нижеперечисленных категорий представляет собой экономический инструмент, благодаря которому вновь созданная стоимость получает денежное выражение и становится объектом распределения?", "o": ["Цена.", "Валютный курс.", "Инвентаризация.", "Валютный риск."], "a": 0}, {"q": "Что из нижеперечисленного представляет собой хозяйство, которое ведется одним или несколькими совместно проживающими людьми, осуществляющими различные виды деятельности, в результате чего образуются и используются финансовые ресурсы и доходы, и имеет общий бюджет?", "o": ["Финансы домашних хозяйств.", "Программно-целевой метод (программное бюджетирование).", "Бизнес-план инвестиционного проекта.", "Домашнее хозяйство (домохозяйство)."], "a": 3}, {"q": "Что из перечисленного ниже представляет собой финансовый инструмент с фиксированным уровнем доходности?", "o": ["Финансовое регулирование (государственное регулирование экономики).", "Домашнее хозяйство (домохозяйство).", "Финансовый прогноз (финансовое прогнозирование).", "Облигация (или банковский вклад с фиксированной процентной ставкой)."], "a": 3}, {"q": "Что из перечисленного ниже представляет собой группу лиц, совместно проживающих и принимающих экономические решения?", "o": ["Финансовое регулирование (государственное регулирование экономики).", "Облигация (или банковский вклад с фиксированной процентной ставкой).", "Финансовый прогноз (финансовое прогнозирование).", "Домашнее хозяйство (домохозяйство)."], "a": 3}, {"q": "Какой из нижеперечисленных элементов управления финансами выражает составление различных планов предприятий?", "o": ["Функция финансового планирования.", "Оперативное планирование (краткосрочное).", "Текущее планирование (годовое / тактическое).", "Финансовое планирование."], "a": 3}, {"q": "Какая функция управления финансами выявляет тенденции развития финансовых отношений?", "o": ["Функция финансового планирования.", "Функция финансового регулирования (или финансовый ко const N=Q.length,BS=25,NB=Math.ceil(N/BS);
const KEY="finquiz262_v1";
let S={ok:{},wrong:[],sel:[0],auto:true,shuf:false,skip:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
const L="АБВГ".split("");
let run=null,timer=null;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const bRange=b=>[b*BS,Math.min(N,b*BS+BS)];

function home(){
 clearTimeout(timer);
 const learned=Object.keys(S.ok).length;
 let chips="";
 for(let b=0;b<NB;b++){
  const [s,e]=bRange(b);let c=0;for(let i=s;i<e;i++)if(S.ok[i])c++;
  chips+=`<button class="chip${S.sel.includes(b)?" on":""}${c==e-s?" full":""}" data-b="${b}">${s+1}–${e}<small>${c==e-s?"✓ ":""}${c}/${e-s}</small></button>`;
 }
 $.innerHTML=`<h1>Финансы · ${N} вопросов</h1><p class="s">Выберите блоки, которые хотите решать сейчас</p>
 <div class="card st"><div>Выучено: <b>${learned}</b><span> / ${N}</span></div><div>Ошибок: <b>${S.wrong.length}</b></div></div>
 <div class="card"><div class="mini"><button id="all">Все блоки</button><button id="none">Снять все</button></div>
 <div class="grid">${chips}</div>
 <label class="chk"><input type="checkbox" id="skip" ${S.skip?"checked":""}>Пропускать уже верно отвеченные</label>
 <label class="chk"><input type="checkbox" id="shuf" ${S.shuf?"checked":""}>Перемешать вопросы</label>
 <label class="chk"><input type="checkbox" id="auto" ${S.auto?"checked":""}>Автопереход к следующему вопросу</label>
 <button class="btn" id="go">Начать</button></div>
 <button class="btn g" id="wr" ${S.wrong.length?"":"disabled"}>Работа над ошибками (${S.wrong.length})</button>
 <button class="btn g" id="rs">Сбросить прогресс</button>`;
 document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const b=+c.dataset.b;S.sel=S.sel.includes(b)?S.sel.filter(x=>x!=b):[...S.sel,b];save();c.classList.toggle("on")});
 document.getElementById("all").onclick=()=>{S.sel=[...Array(NB).keys()];save();home()};
 document.getElementById("none").onclick=()=>{S.sel=[];save();home()};
 for(const k of["skip","shuf","auto"])document.getElementById(k).onchange=e=>{S[k]=e.target.checked;save()};
 document.getElementById("go").onclick=()=>{
  let ids=[];for(const b of [...S.sel].sort((x,y)=>x-y)){const [s,e]=bRange(b);for(let i=s;i<e;i++)ids.push(i)}
  if(S.skip)ids=ids.filter(i=>!S.ok[i]);
  if(!ids.length){alert(S.sel.length?"В выбранных блоках всё уже решено верно 🎉":"Выберите хотя бы один блок");return}
  begin(S.shuf?shuffle(ids):ids)};
 document.getElementById("wr").onclick=()=>begin(shuffle(S.wrong));
 document.getElementById("rs").onclick=()=>{if(confirm("Сбросить весь прогресс?")){S.ok={};S.wrong=[];save();home()}};
}
function begin(ids){run={ids,i:0,ans:{}};show()}
function score(){let ok=0,bad=[];run.ids.forEach((id,p)=>{if(p in run.ans){run.ans[p]==Q[id].a?ok++:bad.push(id)}});return{ok,bad}}
function show(){
 clearTimeout(timer);
 const id=run.ids[run.i],q=Q[id],a=run.ans[run.i],done=a!==undefined,sc=score();
 const last=run.i==run.ids.length-1;
 $.innerHTML=`<div class="top"><span>Вопрос ${id+1} · ${run.i+1} из ${run.ids.length}</span><span>✓ ${sc.ok} · ✗ ${sc.bad.length}</span></div>
 <div class="bar"><i style="width:${run.i/run.ids.length*100}%"></i></div>
 <div class="card"><p class="q">${esc(q.q)}</p>${q.o.map((t,k)=>{
  let c="";if(done){if(k==q.a)c=" ok";else if(k==a)c=" no"}
  return `<button class="o${c}" data-k="${k}" ${done?"disabled":""}><b>${L[k]}</b><span>${esc(t)}</span></button>`}).join("")}</div>
 <div class="row"><button class="btn g" id="pv" ${run.i==0?"disabled":""}>← Назад</button><button class="btn" id="nx" ${done?"":"disabled"}>${last?"Результаты":"Дальше →"}</button></div>
 <button class="btn g" id="ex">Завершить</button>`;
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 document.getElementById("pv").onclick=()=>{run.i--;show();scrollTo(0,0)};
 document.getElementById("nx").onclick=next;
 document.getElementById("ex").onclick=end;
}
function next(){clearTimeout(timer);if(run.i>=run.ids.length-1)end();else{run.i++;show();scrollTo(0,0)}}
function pick(k){
 if(run.i in run.ans)return;
 const id=run.ids[run.i],r=k==Q[id].a;
 run.ans[run.i]=k;
 if(r){S.ok[id]=1;S.wrong=S.wrong.filter(x=>x!=id)}else{delete S.ok[id];if(!S.wrong.includes(id))S.wrong.push(id)}
 save();show();
 if(S.auto)timer=setTimeout(next,r?900:2800);
}
function end(){
 clearTimeout(timer);
 const sc=score(),t=sc.ok+sc.bad.length,p=t?Math.round(sc.ok/t*100):0;
 $.innerHTML=`<h1>Результат</h1><div class="card"><div class="big">${p}%</div><p class="s">Верно ${sc.ok} из ${t}</p></div>
 ${sc.bad.length?`<div class="card"><b>Ошибки:</b> вопросы № ${sc.bad.map(i=>i+1).join(", ")}</div><button class="btn" id="rw">Повторить ошибки</button>`:""}
 <button class="btn g" id="hm">В меню</button>`;
 document.getElementById("hm").onclick=home;
 const rw=document.getElementById("rw");if(rw)rw.onclick=()=>begin(shuffle(sc.bad));
}
home();
</script></body></html>
